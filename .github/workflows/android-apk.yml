name: Build Zenvora Native Android App
run-name: Build Zenvora Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-native/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-native-android:
    name: Compile native Kotlin Android app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate Gradle wrapper
        working-directory: android-native
        run: gradle wrapper --gradle-version 8.9
      - name: Build native debug APK
        working-directory: android-native
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: Zenvora-Native-Android-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
