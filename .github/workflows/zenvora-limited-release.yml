name: Build Zenvora Limited Distribution Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ZENVORA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ZENVORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZENVORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZENVORA_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Missing Zenvora signing secrets. Add all four repository Actions secrets before running this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Prepare persistent upload keystore
        working-directory: android-native/app
        env:
          KEYSTORE_B64: ${{ secrets.ZENVORA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > zenvora-upload.jks
          test -s zenvora-upload.jks
      - name: Generate Gradle wrapper
        working-directory: android-native
        run: gradle wrapper --gradle-version 8.11.1
      - name: Build signed release APK and AAB
        working-directory: android-native
        env:
          ZENVORA_KEYSTORE_PASSWORD: ${{ secrets.ZENVORA_KEYSTORE_PASSWORD }}
          ZENVORA_KEY_ALIAS: ${{ secrets.ZENVORA_KEY_ALIAS }}
          ZENVORA_KEY_PASSWORD: ${{ secrets.ZENVORA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Upload signed release files
        uses: actions/upload-artifact@v4
        with:
          name: Zenvora-Limited-Distribution-v1.0.1
          path: |
            android-native/app/build/outputs/apk/release/*.apk
            android-native/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
