services:
  - type: web
    name: brohack67-ai-tutor
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-3-mini
      - key: CORS_ORIGIN
        value: https://brohack4567-art.github.io
